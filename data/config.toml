[paths]
input_csv = "path/to/input.csv"
input_json = "path/to/input.json"

[random]
seed = 42

[time]
historic_start = 1608 # First year for historic age cohorts
historic_end = 2021   # Last year for historic age cohorts
future_end = 2071     # Last year for the future age cohorts

[census]
    [census.type_map]
    # other replacements are automatic in cleaning process
    total = "total"
    movable = "mobile"
    fewer = "apartment_lt_5"  # "fewer than"
    more = "apartment_ge_5"  # "or more"
    "semi-" = "semi_detached"
    duplex = "apartment_duplex"

[dwelling_stock]
target_dwelling_types = ["apartments", "mobile", "single_attached", "single_detached"]

total_dwelling_types = [
    "single_detached",
    "semi_detached",
    "row",
    "apartment_duplex",
    "apartment_ge_5",
    "apartment_lt_5",
    "other_single_attached",
    "mobile",  # includes other_movable
    "other_dwelling",  # added for older censuses
    "apartments",  # added for older censuses
    "single_attached",  # added for older censuses
    "total",  # added for older censuses
    "other_attached_dwelling", # added for newer censuses
]

historic_vintages = [
    "1608-2025",  # total
    "1608-1945",
    "1608-1920",
    "1921-1945",
    "1946-1960",
    "1961-1970",
    "1971-1980",
    "1981-1990",
    "1991-1995",
    "1996-2000",
    "2001-2005",
    "2006-2010",
    "2011-2015",
    "2016-2020",
    "2021-2025",

]

cohort_definitions = ["pre_1945", "1945_1970", "1970_1990", "post_1990"]  # FIXME unused?
neud_cohorts = [
    "1608-1946",
    "1946-1960",
    "1961-1977",
    "1978-1983",
    "1984-1995",
    "1996-2000",
    "2001-2005",
    "2006-2010",
    "2011-2015",
    "2016-2020",
] # Based on NEUD definition

cov = 0.2
cv_population = 0.0012

[dwelling_stock.agg_types]
apartments = ["apartment_duplex", "apartment_ge_5", "apartment_lt_5"]
single_attached = ["semi_detached", "other_single_attached", "row"]
other_attached_dwelling = [ "apartment_duplex", "apartment_lt_5",
        "other_single_attached", "row", "semi_detached",
    ]
